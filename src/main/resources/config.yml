    kolor-nicku: "#e6e6e6"
    kolor-wiadomosci: "#d6d6d6"
    waga: 0
    domyslna: true
    uprawnienia: []

antyspam:
  min-odstep-ms: 1000        # najkrótszy odstęp między wiadomościami
  max-wiadomosci: 4          # ile wiadomości…
  okno-sekund: 6             # …w tym oknie czasu
  powtorka-sekund: 30        # ta sama wiadomość drugi raz dopiero po tym czasie
  caps-procent: 70           # powyżej tylu % wielkich liter wiadomość jest zamieniana na małe
  caps-min-dlugosc: 8

filtr:
  wlaczony: true
  # Rdzenie słów: słowo zawierające rdzeń zamienia się na gwiazdki. Wielkość liter, polskie znaki
  # i powtórzone litery (kuuurwa) nie pomagają. Cyfry zamiast liter łapie tylko częściowo (1→i, 3→e, 4→a, 0→o).
  slowa: [kurw, chuj, huj, pierdol, pierdal, pizd, jeba, jebi, jebn, jebc, jebie, pojeb, cipa, cipk, kutas, dziwk, cwel]
  # Słowa, które zawierają rdzeń, ale są w porządku.
  wyjatki: [zajebist, zajebisc]

wzmianki:
  dzwiek: block.note_block.pling
  ton: 1.6

prywatne:
  dzwiek: block.note_block.chime
  ton: 1.3

# Lista graczy pod TAB. MiniMessage; znaczniki: <online> <max> <ping> <nick> <ranga> (oraz <tps>, jeśli kiedyś zechcesz)
# <anim>tekst</anim> = złoty gradient, który się przelewa (jak intro przy wejściu).
tab:
  wlaczony: true
  odswiezanie-tickow: 4
  naglowek:
    - ""
    - "<b><anim>☀  S U N C R A F T  ☀</anim></b>"
    - "<gray>Latające wyspy</gray>"
    - ""
  stopka:
    - ""
    - "<gray>Online: <white><online></white><dark_gray>/</dark_gray><gray><max></gray>   <dark_gray>·</dark_gray>   <gray>Ping: <ping>"
    - "<dark_gray>Twoja ranga: <ranga>"
    - ""
    - "<#ffc02e>onyxdev.pl"
    - ""
