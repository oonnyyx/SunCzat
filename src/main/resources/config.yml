  legenda:
    nazwa: "Legenda"
    obrazek: "\uE007"
    prefiks: "<gradient:#ffe27a:#e39a00>[Legenda]</gradient>"
    kolor-nicku: "#ffe9a8"
    kolor-wiadomosci: "#fff8e6"
    waga: 300
    uprawnienia: []
  vip:
    nazwa: "VIP"
    obrazek: "\uE008"
    prefiks: "<#e85ad6>[VIP]</#e85ad6>"
    kolor-nicku: "#fbdcf6"
    kolor-wiadomosci: "#f4f4f4"
