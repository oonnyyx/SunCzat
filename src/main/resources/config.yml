# SunCzat — czat SunCraftMC. Po zmianach: /czat reload
#
# Format linii czatu (MiniMessage). Znaczniki: <prefiks> <nick> <wiadomosc>
format: "<prefiks> <nick> <dark_gray>»</dark_gray> <wiadomosc>"

# Paczka zasobów SunCraft (przedmioty i obrazki rang). Wysyła ją ten plugin przy wchodzeniu,
# więc w server.properties resource-pack ma być PUSTE (inaczej gracz dostanie ją dwa razy).
# Nowa wersja paczki: zmień url i sha1 tutaj, /czat reload (bez restartu).
paczka:
  url: ""
  sha1: ""
  opis: "<gold>SunCraft: mityczne przedmioty, rangi i grafiki serwera"
  wymagana: false
  czekaj-sekund: 90

# Rangi. Nadawanie: /ranga daj <gracz> <ranga>. Gracz bez rangi dostaje tę z domyslna: true.
# waga: wyższa = ważniejsza (wyżej na liście graczy pod TAB).
# uprawnienia: nadawane graczowi razem z rangą (np. czat.wycisz dla moderatora).
# obrazek: znak plakietki z paczki zasobów (czcionka suncraft:rangi, U+E001…U+E00E). Kto ma paczkę, widzi obrazek;
#          kto nie ma, widzi prefiks tekstowy. W TAB i nad głową zawsze obrazek (to jedna wersja dla wszystkich).
rangi:
  owner:
    nazwa: "Owner"
    obrazek: "\uE001"
    prefiks: "<#ff4d4d><b>[Owner]</b></#ff4d4d>"
    kolor-nicku: "#ffd6d2"
    kolor-wiadomosci: "#ffffff"
    waga: 1000
    uprawnienia: [czat.admin, czat.wycisz, czat.bypass]
  admin:
    nazwa: "Admin"
    obrazek: "\uE002"
    prefiks: "<#ff7a3d>[Admin]</#ff7a3d>"
    kolor-nicku: "#ffe2d4"
    kolor-wiadomosci: "#ffffff"
    waga: 900
    uprawnienia: [czat.admin, czat.wycisz, czat.bypass]
  modplus:
    nazwa: "Mod+"
    obrazek: "\uE003"
    prefiks: "<#b07cff>[Mod+]</#b07cff>"
    kolor-nicku: "#ece2ff"
    kolor-wiadomosci: "#ffffff"
    waga: 800
    uprawnienia: [czat.wycisz, czat.bypass]
  moderator:
    nazwa: "Mod"
    obrazek: "\uE004"
    prefiks: "<#4f9bff>[Mod]</#4f9bff>"
    kolor-nicku: "#dcebff"
    kolor-wiadomosci: "#ffffff"
    waga: 700
    uprawnienia: [czat.wycisz, czat.bypass]
  helper:
    nazwa: "Helper"
    obrazek: "\uE005"
    prefiks: "<#3ccb6e>[Helper]</#3ccb6e>"
    kolor-nicku: "#dcf7e5"
    kolor-wiadomosci: "#ffffff"
    waga: 600
    uprawnienia: [czat.wycisz]
  chatmod:
    nazwa: "ChatMod"
    obrazek: "\uE006"
    prefiks: "<#2ec4b6>[ChatMod]</#2ec4b6>"
    kolor-nicku: "#d6f7f3"
    kolor-wiadomosci: "#ffffff"
    waga: 500
    uprawnienia: [czat.wycisz]
  streamer:
    nazwa: "Streamer"
    obrazek: ""
    prefiks: "<#53fc18>[Streamer]</#53fc18>"
    kolor-nicku: "#e2ffd6"
    kolor-wiadomosci: "#ffffff"
    waga: 450
    uprawnienia: []
  youtubeplus:
    nazwa: "YouTube+"
    obrazek: ""
    prefiks: "<#ff3b3b><b>[YouTube+]</b></#ff3b3b>"
    kolor-nicku: "#ffdede"
    kolor-wiadomosci: "#ffffff"
    waga: 420
    uprawnienia: []
  tiktokplus:
    nazwa: "TikTok+"
    obrazek: ""
    prefiks: "<gradient:#2ef2ea:#ff2d6f><b>[TikTok+]</b></gradient>"
    kolor-nicku: "#e0fbfa"
    kolor-wiadomosci: "#ffffff"
    waga: 410
    uprawnienia: []
  youtube:
    nazwa: "YouTube"
    obrazek: ""
    prefiks: "<#ff3b3b>[YouTube]</#ff3b3b>"
    kolor-nicku: "#ffe6e6"
    kolor-wiadomosci: "#f4f4f4"
    waga: 360
    uprawnienia: []
  tiktok:
    nazwa: "TikTok"
    obrazek: ""
    prefiks: "<#2ef2ea>[TikTok]</#2ef2ea>"
    kolor-nicku: "#e6fcfb"
